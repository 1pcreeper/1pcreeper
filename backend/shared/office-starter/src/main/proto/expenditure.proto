syntax = "proto3";

package office_expenditure;
option java_multiple_files = true;
option java_package = "project.shared_office_starter.grpc";
option java_outer_classname = "OfficeExpenditureServiceProto";

service OfficeExpenditureRPCService {
  rpc getSalaryByStaffId (OfficeStaffSalaryRequest) returns (OfficeStaffSalaryResponse);
}

message OfficeStaffSalaryRequest {
  int64 staffId = 1;
}

message OfficeStaffSalaryResponse {
  int64 staffId = 1;
  string amount = 2;
  string approvedAt = 3;
  bool isActive = 4;
}
